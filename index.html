<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de usuarios</title>
    <!-- Bootstrap para dar estilo a la página -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header class="bg-primary text-white text-center p-4">
        <h1>Buscador de usuarios</h1>
        <p class="mb-0">Información obtenida desde una API</p>
    </header>

    <main class="container my-4">
        <section class="mb-4">
            <h2>Buscar usuario</h2>
            <label for="busqueda" class="form-label">Nombre o correo:</label>
            <input type="text" id="busqueda" class="form-control" placeholder="Escribe un nombre o correo">
            <button id="btnBuscar" class="btn btn-primary mt-2">Buscar</button>
            <button id="btnMostrar" class="btn btn-secondary mt-2">Mostrar todos</button>
        </section>

        <section>
            <h2>Resultados</h2>
            <p id="estado">Cargando usuarios...</p>
            <div id="resultados" class="row g-3"></div>
        </section>
    </main>

    <footer class="text-center bg-light p-3 mt-4">
        <p class="mb-0">Trabajo de Diseño y Desarrollo de Software - INF211</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
